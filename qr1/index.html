<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening District App…</title>
  <script src="../config.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var appLink = QR1_APP_URL;
      var webLink = QR1_WEB_URL;

      // Show the destination in the UI
      document.getElementById('dest').textContent = 'District App';

      // Fallback: if the app didn't open within 1.5 s, go to the website
      var fallbackTimer = setTimeout(function () {
        window.location.replace(webLink);
      }, 1500);

      // If the app opens, the page becomes hidden — cancel the fallback
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
        }
      });

      // Fire the deep link
      window.location.replace(appLink);
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #aaa; font-size: 14px; margin-top: 8px; }
    a { color: #4ade80; word-break: break-all; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Opening <strong id="dest"></strong>…</p>
  <p style="margin-top:16px;font-size:12px;">If nothing happens, <a id="weblink" href="#">tap here</a></p>
  <script>
    document.getElementById('weblink').href = QR1_WEB_URL;
  </script>
</body>
</html>
